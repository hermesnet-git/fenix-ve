<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raio-X · BPMN × DM × Postman × curl · FTAT-933</title>
<script>
  try { const t = new URLSearchParams(location.hash.slice(1)).get('tema') || JSON.parse(localStorage.getItem('raiox.ftat933.v3') || '{}').ui?.tema;
    document.documentElement.dataset.tema = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'); }
  catch (e) { document.documentElement.dataset.tema = 'claro'; }
</script>
<style>
:root {
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  --pink: #e6007e;
}
:root, :root[data-tema=claro] {
  color-scheme: light;
  --bg: oklch(0.985 0.002 300); --panel: #fff; --sub: oklch(0.968 0.004 300); --hover: oklch(0.955 0.006 300);
  --ink: oklch(0.22 0.02 300); --ink-2: oklch(0.42 0.02 300); --ink-3: oklch(0.53 0.015 300);
  --line: oklch(0.925 0.005 300); --line-2: oklch(0.87 0.008 300);
  --brand-ink: oklch(0.4 0.17 315); --brand-tint: oklch(0.955 0.025 315);
  --falta: oklch(0.955 0.035 25); --falta-ink: oklch(0.5 0.17 25);
  --parcial: oklch(0.965 0.05 85); --parcial-ink: oklch(0.48 0.1 70);
  --sombra: 0 -8px 30px rgba(20, 0, 40, .12);
}
:root[data-tema=escuro] {
  color-scheme: dark;
  --bg: oklch(0.155 0.012 300); --panel: oklch(0.195 0.016 300); --sub: oklch(0.175 0.014 300); --hover: oklch(0.225 0.018 300);
  --ink: oklch(0.94 0.008 300); --ink-2: oklch(0.78 0.014 300); --ink-3: oklch(0.64 0.015 300);
  --line: oklch(0.27 0.018 300); --line-2: oklch(0.34 0.02 300);
  --brand-ink: oklch(0.8 0.12 315); --brand-tint: oklch(0.3 0.08 315);
  --falta: oklch(0.72 0.18 25 / .16); --falta-ink: oklch(0.78 0.15 25);
  --parcial: oklch(0.85 0.13 85 / .13); --parcial-ink: oklch(0.86 0.13 85);
  --sombra: 0 -10px 30px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13.5px/1.5 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
code { font-family: var(--mono); font-size: 12px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── shell ── */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--panel); border-right: 1px solid var(--line); }
.marca { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.marca b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #660099; color: #fff; font-size: 13px; }
.marca span { display: block; font-weight: 650; }
.marca small { display: block; color: var(--ink-3); font-size: 11.5px; }
.side h2 { font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 0 6px 6px; }
.int { display: flex; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-radius: 8px; background: none; }
.int:hover { background: var(--hover); }
.int[aria-current=true] { background: var(--brand-tint); }
.int code { font-weight: 650; color: var(--brand-ink); padding-top: 1px; }
.int > span { font-weight: 550; }
.cont { display: flex; gap: 10px; margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cont span { display: inline-flex; align-items: center; gap: 4px; }
.cont i { width: 8px; height: 8px; border-radius: 2px; background: var(--vc); }
.pe { margin-top: auto; display: grid; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); font-weight: 550; }
.btn:hover { background: var(--hover); }
#salvo { font-size: 11.5px; color: var(--ink-3); padding: 0 4px; }
#salvo.erro { color: var(--falta-ink); }

main { min-width: 0; padding: 22px 32px 0; }
.topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.015em; }
h1 code { font-size: 19px; color: var(--brand-ink); margin-right: 6px; }
.topo p { color: var(--ink-3); margin-top: 4px; }
.como { color: var(--ink-3); font-size: 12.5px; margin-bottom: 14px; }
kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--panel); }
.ico { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); flex: none; }

/* ── planilha ── */
.tw { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
col.c0 { width: 48px; } col.c1 { width: 180px; }
th { text-align: left; padding: 9px 10px; background: var(--sub); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; }
th small { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th.bp { color: var(--brand-ink); }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; cursor: cell; }
td + td { border-left: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
/* veredito do campo: verde tudo certo · amarelo confirmar/validar · vermelho ajustar no BPMN */
.v-ok { --vc: oklch(0.6 0.14 155); --vb: oklch(0.93 0.06 155); --vt: oklch(0.38 0.1 155); }
.v-at { --vc: oklch(0.91 0.18 100); --vb: oklch(0.95 0.08 92);  --vt: oklch(0.45 0.1 70); }
.v-aj { --vc: oklch(0.58 0.2 25);  --vb: oklch(0.92 0.06 25);  --vt: oklch(0.47 0.18 25); }
:root[data-tema=escuro] .v-ok { --vb: oklch(0.6 0.14 155 / .28); --vt: oklch(0.85 0.12 155); }
:root[data-tema=escuro] .v-at { --vb: oklch(0.8 0.15 85 / .24);  --vt: oklch(0.88 0.13 88); }
:root[data-tema=escuro] .v-aj { --vb: oklch(0.6 0.2 25 / .3);    --vt: oklch(0.82 0.13 25); }
td.rh { font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; background: var(--vc); text-align: center; cursor: default; }
td.rh.v-at { color: oklch(0.25 0.05 70); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 12.5px; color: var(--ink-2); }
.legenda > div { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.legenda .tit { font-weight: 650; color: var(--ink); font-size: 12px; }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg i { width: 14px; height: 14px; border-radius: 4px; background: var(--vc); flex: none; }
.lg b { color: var(--vt); }
.lg i.c-falta { background: var(--falta); box-shadow: inset 0 0 0 1px var(--falta-ink); }
.lg i.c-parcial { background: var(--parcial); box-shadow: inset 0 0 0 1px var(--parcial-ink); }
.lg i.c-nenvia { background: none; box-shadow: inset 0 0 0 1px var(--line-2); }
.vd { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--vb); color: var(--vt); font-size: 11.5px; font-weight: 650; }
tr.on td { box-shadow: inset 0 2px 0 var(--brand-ink), inset 0 -2px 0 var(--brand-ink); font-weight: 600; }
tr.grp td { background: var(--sub); font-weight: 650; cursor: default; font-size: 13px; }
tr.grp small { color: var(--ink-3); font-weight: 400; margin-left: 8px; }
.k-falta { background: var(--falta); color: var(--falta-ink); font-weight: 600; }
.k-parcial { background: var(--parcial); }
.k-nenvia { color: var(--ink-3); font-style: italic; }
.k-nan { color: var(--ink-3); font-style: italic; background: var(--sub); }
.lg i.c-nan { background: var(--sub); box-shadow: inset 0 0 0 1px var(--line-2); }
.tag { display: inline-block; color: var(--parcial-ink); font-weight: 650; font-size: 11.5px; margin-right: 6px; font-style: normal; }
.ob { display: inline-block; font-size: 10.5px; font-weight: 650; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); margin-right: 6px; vertical-align: 1px; }
.temnota { color: var(--pink); vertical-align: -3px; margin-left: 4px; width: 14px; height: 14px; }
.tp { font-weight: 400; color: var(--ink-3); font-family: var(--mono); font-size: 11px; margin-left: 6px; }

/* ── faixa de detalhe (fixa embaixo) ── */
.faixa { position: sticky; bottom: 0; z-index: 5; margin: 14px -8px 0; max-height: 48vh; overflow: auto; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--panel); box-shadow: var(--sombra); padding: 12px 16px 16px; }
.faixa h3 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; font-size: 14px; font-weight: 650; }
.faixa h3 code { color: var(--ink-3); font-size: 11.5px; font-weight: 500; }
.grade4 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.grade4 > div { background: var(--panel); padding: 9px 11px; overflow-wrap: anywhere; font-size: 13px; }
.grade4 b { display: block; font-size: 11px; font-weight: 700; color: var(--ink-3); margin-bottom: 2px; font-style: normal; }
.grade4 > div.k-falta { background: var(--falta); }
.grade4 > div.k-parcial { background: var(--parcial); }
.det { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.det p + p { margin-top: 8px; }
.det .mudo { font-size: 12px; color: var(--ink-3); }
.det label span { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-bottom: 4px; }
.det textarea { width: 100%; min-height: 70px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
  .pe { margin: 0; }
  main { padding: 18px 16px 0; }
  .tw { overflow-x: auto; }
  table { min-width: 900px; }
  .grade4, .det { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca"><b>RX</b><div><span>Raio-X</span><small>FTAT-933 · Abertura de BD</small></div></div>
    <nav aria-label="Integrações"><h2>Integrações</h2><div id="ints"></div></nav>
    <div class="pe">
      <button class="btn" id="btn-exp" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Exportar notas</button>
      <div id="salvo" role="status"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>window.RAIOX = { ints: [], registrar(d) { this.ints.push(d); } };</script>
<script src="dados/int01-consulta-massiva.js"></script>
<script src="dados/int03-consulta-bd.js"></script>
<script src="dados/int06-solicita-diagnostico.js"></script>
<script src="dados/int10-resultado-diagnostico.js"></script>
<script src="dados/int11-consulta-slots.js"></script>
<script src="dados/int14-cria-wo.js"></script>
<script src="dados/int16-cancela-wo.js"></script>
<script src="dados/int18-abre-bd.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ── persistência ── */
const CHAVE = 'raiox.ftat933.v3';
let db = { notas: {}, ui: {} }, gravavel = true;
try { const t = localStorage.getItem(CHAVE); if (t) db = Object.assign({ notas: {}, ui: {} }, JSON.parse(t)); } catch (e) { gravavel = false; }
const status = (t, erro) => { const el = $('#salvo'); el.textContent = t; el.classList.toggle('erro', !!erro); };
const salvar = msg => {
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); gravavel = true; if (msg !== false) status(msg || 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })); }
  catch (e) { gravavel = false; status('O navegador bloqueou o salvamento: use Exportar notas', true); }
};

/* ── modelo ── */
const FS = ['BPMN', 'DM', 'PM', 'CURL', 'QA'];
const NOME = { BPMN: 'BPMN', DM: 'DM', PM: 'Postman', CURL: 'curl', QA: 'QA' };
const h = new URLSearchParams(location.hash.slice(1));
let I = RAIOX.ints.find(i => i.id === h.get('int')) || RAIOX.ints[0];
let sel = h.get('campo');

const nota = id => db.notas[I.id + ':' + id]?.texto || '';
const campos = () => I.campos.filter(c => c.bpmn || FS.some(F => F !== 'BPMN' && c.fontes[F]));

/* situação de uma célula: ok | falta | parcial | nenvia */
function cel(c, F) {
  if (F === 'BPMN') return c.bpmn ? { k: 'ok', h: esc(c.bpmn), t: c.bpmn } : { k: 'falta', h: 'Não implementado', t: 'Não implementado' };
  if (!I.fontes.some(f => f.id === F)) return { k: 'nan', h: 'Não analisado', t: 'Não analisado' };  /* fonte ainda não lida nesta INT */
  const d = c.fontes[F];
  if (!d) return { k: 'falta', h: F === 'DM' ? 'Não consta no DM' : 'Não consta', t: 'Não consta' };
  if (/^Não (envia|lê)/.test(d.v)) return { k: 'nenvia', h: esc(d.v), t: d.v };
  let hh = esc(d.v);
  const m = F === 'DM' && /^(Obrigatório|Não obrigatório|Opcional)\s*·?\s*/.exec(d.v);
  if (m) hh = `<span class="ob">${m[1]}</span>` + esc(d.v.slice(m[0].length));
  const k = d.r === 'parcial' || d.r === 'diverge' ? 'parcial' : 'ok';
  return { k, h: (k === 'parcial' ? `<span class="tag">${d.r === 'diverge' ? 'Diverge' : 'Bate em parte'}</span>` : '') + hh, t: d.v };
}
/* veredito da análise: bpmn → ajustar no BPMN; decidir/fonte → confirmar/validar; nada → tudo certo */
const VER = { ok: 'Tudo certo', at: 'Confirmar / validar', aj: 'Ajustar no BPMN' };
const ver = c => c.acao === 'bpmn' ? 'aj' : (c.acao === 'decidir' || c.acao === 'fonte') ? 'at' : 'ok';
const icoNota = c => nota(c.id) ? '<svg class="i temnota" viewBox="0 0 24 24" aria-label="tem nota"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>' : '';

function faixa(c) {
  return `<div class="faixa" aria-live="polite">
    <h3><span class="vd v-${ver(c)}">${VER[ver(c)]}</span>${esc(c.nome)}<span class="tp">${esc(c.tipo)}</span><code>${c.id} · ${esc(I.grupos.find(g => g.id === c.grupo)?.nome)}</code></h3>
    <div class="grade4">${FS.map(F => { const x = cel(c, F); return `<div class="k-${x.k}"><b>${NOME[F]}</b>${x.h}</div>`; }).join('')}</div>
    <div class="det">
      <div><p>${esc(c.leitura)}</p>${c.acaoTexto ? `<p><b>Ação:</b> ${esc(c.acaoTexto)}</p>` : ''}<p class="mudo">De onde saiu esta linha: ${esc(c.linha)}.${c.valor?.de ? ` Origem do valor no BPMN: ${esc(c.valor.de)}.` : ''}</p></div>
      <label><span>Nota</span><textarea data-nota="${c.id}" placeholder="Fica salva neste navegador">${esc(nota(c.id))}</textarea></label>
    </div></div>`;
}

function render() {
  const cs = campos();
  if (!cs.find(c => c.id === sel)) sel = cs[0].id;
  const c = cs.find(x => x.id === sel);
  $('#ints').innerHTML = RAIOX.ints.map(i => { const n = v => i.campos.filter(x => ver(x) === v).length;
    return `<button class="int" type="button" data-int="${i.id}" aria-current="${i === I}"><code>${i.id}</code><span>${esc(i.nome)}
      <small class="cont"><span class="v-aj" title="Ajustar no BPMN"><i></i>${n('aj')}</span><span class="v-at" title="Confirmar / validar"><i></i>${n('at')}</span><span class="v-ok" title="Tudo certo"><i></i>${n('ok')}</span></small></span></button>`; }).join('');
  const linha = r => `<tr class="${r.id === sel ? 'on' : ''}"><td class="rh v-${ver(r)}" title="${VER[ver(r)]}">${r.id}</td><td data-cel="${r.id}:-1" title="${esc(r.nome)} · ${esc(r.tipo)} · de onde saiu: ${esc(r.linha)}">${esc(r.nome)}<span class="tp">${esc(r.tipo)}</span>${icoNota(r)}</td>${FS.map((F, i) => {
    const y = cel(r, F); return `<td class="k-${y.k}" data-cel="${r.id}:${i}" title="${esc(y.t)}">${esc(y.t)}</td>`; }).join('')}</tr>`;
  $('#main').innerHTML = `
    <div class="topo">
      <div><h1><code>${I.id}</code>${esc(I.nome)}</h1><p><code>${esc(I.endpoint)}</code></p></div>
      <button class="ico" id="tema" type="button" aria-label="Alternar tema claro/escuro">${document.documentElement.dataset.tema === 'escuro'
        ? '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
        : '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'}</button>
    </div>
    <p class="como">Clique numa linha ou navegue com <kbd>↑</kbd> <kbd>↓</kbd>. O texto completo, a análise e a nota ficam na faixa de baixo.</p>
    <div class="legenda">
      <div><span class="tit">Linhas</span>
        <span>Cada linha é um item da chamada: header, parâmetro, campo do body, código ou campo da resposta, ou regra (timeout, decisão). A lista junta tudo o que o BPMN usa e tudo o que o DM documenta para esta integração; o tipo aparece ao lado do nome e a faixa de baixo diz de onde a linha saiu.</span></div>
      <div><span class="tit">Código da linha</span>
        <span class="lg v-ok"><i></i><b>Verde</b> tudo certo: o BPMN atende, nada a fazer</span>
        <span class="lg v-at"><i></i><b>Amarelo</b> ponto de atenção: confirmar ou validar com a área, ou ajustar a documentação</span>
        <span class="lg v-aj"><i></i><b>Vermelho</b> ajustar no BPMN</span></div>
      <div><span class="tit">Células</span>
        <span class="lg"><i class="c-falta"></i>não consta na fonte / não implementado no BPMN</span>
        <span class="lg"><i class="c-parcial"></i>bate em parte com o BPMN</span>
        <span class="lg"><i class="c-nenvia"></i><em>não envia</em>: a fonte também não manda, igual ao BPMN</span>
        <span class="lg"><i class="c-nan"></i><em>não analisado</em>: esta fonte ainda não foi lida para esta integração</span></div>
    </div>
    <div class="tw"><table><colgroup><col class="c0"><col class="c1">${FS.map(() => '<col>').join('')}</colgroup>
      <thead><tr><th></th><th>Item da chamada<small>nome · tipo</small></th>${FS.map(F => `<th class="${F === 'BPMN' ? 'bp' : ''}">${NOME[F]}<small title="${esc(I.fontes.find(f => f.id === F)?.detalhe || '')}">${F === 'BPMN' ? 'implementado' : esc(I.fontes.find(f => f.id === F)?.arquivo || 'sem arquivo')}</small></th>`).join('')}</tr></thead>
      <tbody>${I.grupos.map(g => { const gc = cs.filter(r => r.grupo === g.id); return gc.length ? `<tr class="grp"><td colspan="7">${esc(g.nome)}<small>${esc(g.sub)}</small></td></tr>` + gc.map(linha).join('') : ''; }).join('')}</tbody>
    </table></div>
    ${faixa(c)}`;
  history.replaceState(null, '', `#int=${I.id}&campo=${sel}`);
}

/* ── eventos ── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cel],[data-int],#tema');
  if (!t) return;
  if (t.dataset.cel) sel = t.dataset.cel.split(':')[0];
  else if (t.dataset.int) { I = RAIOX.ints.find(i => i.id === t.dataset.int); sel = null; }
  else { const novo = document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro'; document.documentElement.dataset.tema = novo; db.ui.tema = novo; salvar(false); }
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('textarea, input') || !/^Arrow(Up|Down)$/.test(e.key)) return;
  const ids = campos().map(c => c.id); let r = ids.indexOf(sel);
  r = e.key === 'ArrowDown' ? Math.min(r + 1, ids.length - 1) : Math.max(r - 1, 0);
  sel = ids[r]; e.preventDefault(); render();
  document.querySelector('tr.on')?.scrollIntoView({ block: 'nearest' });
});
let tm;
document.addEventListener('input', e => {
  const id = e.target.dataset?.nota; if (!id) return;
  const k = I.id + ':' + id, v = e.target.value;
  if (v.trim()) db.notas[k] = { texto: v, ts: new Date().toISOString() }; else delete db.notas[k];
  clearTimeout(tm); tm = setTimeout(() => salvar(), 400);
});
$('#btn-exp').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ app: 'raio-x-ftat933', versao: 3, exportadoEm: new Date().toISOString(), notas: db.notas }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'raio-x-notas-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  status('Notas exportadas');
});

render();
const total = Object.keys(db.notas).length;
status(!gravavel ? 'O navegador bloqueou o salvamento: use Exportar notas' : total ? `${total} nota(s) salvas` : 'Notas ficam salvas neste navegador', !gravavel);
})();
</script>
</body>
</html>
